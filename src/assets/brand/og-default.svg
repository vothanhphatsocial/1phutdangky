<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">1 Phút Đăng Ký</title>
  <desc id="description">Hướng dẫn tài chính dễ hiểu, dễ thực hiện.</desc>

  <defs>
    <linearGradient id="paper" x1="42" y1="42" x2="1158" y2="588" gradientUnits="userSpaceOnUse">
      <stop stop-color="#99c3ff" />
      <stop offset="0.58" stop-color="#9de7df" />
      <stop offset="1" stop-color="#92f1d1" />
    </linearGradient>
    <radialGradient id="light" cx="0" cy="0" r="1" gradientTransform="translate(1040 76) rotate(135) scale(410)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.82" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#173b3e" flood-opacity="0.24" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#f8f6f0" />
  <rect x="42" y="42" width="1116" height="546" rx="72" fill="url(#paper)" />
  <rect x="42" y="42" width="1116" height="546" rx="72" fill="url(#light)" />

  <g font-family="Arial, Helvetica, sans-serif" fill="#0b0c10">
    <text x="112" y="145" fill="#214ba8" font-size="26" font-weight="800" letter-spacing="7">
      1 PHÚT ĐĂNG KÝ
    </text>
    <text x="106" y="276" font-size="70" font-weight="900" letter-spacing="-4">
      Hướng dẫn tài chính
    </text>
    <text x="106" y="356" font-size="70" font-weight="900" letter-spacing="-4">
      dễ hiểu, dễ thực hiện.
    </text>
    <text x="112" y="476" fill="#30343a" font-size="29" font-weight="500">
      Tài khoản · Thẻ tín dụng · Khoản vay · Ví điện tử
    </text>
  </g>

  <g transform="translate(896 135) rotate(6 116 166)" filter="url(#shadow)">
    <rect width="232" height="332" rx="42" fill="#0b0c10" stroke="#43464e" stroke-width="2" />

    <g font-family="Arial, Helvetica, sans-serif">
      <text x="26" y="48" fill="#f8f5ef" font-size="23" font-weight="800" letter-spacing="-0.5">1 Phút</text>
      <text x="26" y="69" fill="#aaa9b2" font-size="10" font-weight="700" letter-spacing="2.2">ĐĂNG KÝ</text>
    </g>

    <g fill="none" stroke-linecap="round" stroke-width="6" transform="rotate(-7 193 53)">
      <path d="M184 38h23" stroke="#315cf5" />
      <path d="M174 51h33" stroke="#a48cff" />
      <path d="M162 64h45" stroke="#6fe0b4" />
    </g>

    <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#91a8ff">
      <text x="27" y="135">01</text>
      <text x="27" y="202">02</text>
      <text x="27" y="269">03</text>
    </g>

    <g fill="#34363c">
      <rect x="68" y="121" width="136" height="13" rx="7" />
      <rect x="68" y="188" width="108" height="13" rx="7" />
      <rect x="68" y="255" width="82" height="13" rx="7" />
    </g>
    <g stroke="#34363c">
      <path d="M24 95h184" />
      <path d="M24 162h184" />
      <path d="M24 229h184" />
      <path d="M24 296h184" />
    </g>
  </g>
</svg>
