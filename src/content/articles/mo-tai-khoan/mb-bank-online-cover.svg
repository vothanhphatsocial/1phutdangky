<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Mở tài khoản MB Bank online</title>
  <desc id="description">Ảnh đại diện bài hướng dẫn của 1 Phút Đăng Ký.</desc>

  <defs>
    <linearGradient id="article-paper" x1="28" y1="28" x2="1172" y2="602" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8fb0ff" />
      <stop offset="0.56" stop-color="#c4abff" />
      <stop offset="1" stop-color="#a9e8d4" />
    </linearGradient>
    <radialGradient id="article-light" cx="0" cy="0" r="1" gradientTransform="translate(1040 70) rotate(135) scale(390)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.78" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="card-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#173b3e" flood-opacity="0.24" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#090a0f" />
  <rect x="28" y="28" width="1144" height="574" rx="58" fill="url(#article-paper)" />
  <rect x="28" y="28" width="1144" height="574" rx="58" fill="url(#article-light)" />

  <g font-family="Arial, Helvetica, sans-serif" fill="#0b0c10">
    <text x="86" y="128" fill="#214ba8" font-size="21" font-weight="800" letter-spacing="4">
      HƯỚNG DẪN · MỞ TÀI KHOẢN
    </text>
    <text x="82" y="244" font-size="64" font-weight="900" letter-spacing="-4">
      Mở tài khoản MB Bank
    </text>
    <text x="82" y="326" font-size="64" font-weight="900" letter-spacing="-4">
      online: Cần chuẩn bị gì
    </text>
    <text x="82" y="408" font-size="64" font-weight="900" letter-spacing="-4">
      và đăng ký thế nào?
    </text>
  </g>

  <g transform="translate(866 126) rotate(6 116 166) scale(1.06)" filter="url(#card-shadow)">
    <rect width="232" height="332" rx="42" fill="#0b0c10" stroke="#43464e" stroke-width="2" />

    <g font-family="Arial, Helvetica, sans-serif">
      <text x="26" y="48" fill="#f8f5ef" font-size="23" font-weight="800" letter-spacing="-0.5">1 Phút</text>
      <text x="26" y="69" fill="#aaa9b2" font-size="10" font-weight="700" letter-spacing="2.2">ĐĂNG KÝ</text>
    </g>

    <g fill="none" stroke-linecap="round" stroke-width="6" transform="rotate(-7 193 53)">
      <path d="M184 38h23" stroke="#315cf5" />
      <path d="M174 51h33" stroke="#a48cff" />
      <path d="M162 64h45" stroke="#6fe0b4" />
    </g>

    <g font-family="Arial, Helvetica, sans-serif">
      <text x="27" y="135" fill="#91a8ff" font-size="13" font-weight="800">01</text>
      <text x="68" y="135" fill="#f6f2ec" font-size="15" font-weight="700">Điều kiện</text>
      <text x="27" y="202" fill="#bba1ff" font-size="13" font-weight="800">02</text>
      <text x="68" y="202" fill="#f6f2ec" font-size="15" font-weight="700">Xác thực</text>
      <text x="27" y="269" fill="#75dfba" font-size="13" font-weight="800">03</text>
      <text x="68" y="269" fill="#f6f2ec" font-size="15" font-weight="700">Mã giới thiệu</text>
    </g>

    <g stroke="#34363c">
      <path d="M24 95h184" />
      <path d="M24 162h184" />
      <path d="M24 229h184" />
      <path d="M24 296h184" />
    </g>
  </g>

</svg>
