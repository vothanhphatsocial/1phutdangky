<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Vay tiền mặt Home Credit online</title>
  <desc id="description">Ảnh đại diện bài hướng dẫn của 1 Phút Đăng Ký.</desc>
  <defs>
    <linearGradient id="loan-paper" x1="28" y1="28" x2="1172" y2="602" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b9a7ff" />
      <stop offset="0.56" stop-color="#d7b6dc" />
      <stop offset="1" stop-color="#ffc4a7" />
    </linearGradient>
    <radialGradient id="loan-light" cx="0" cy="0" r="1" gradientTransform="translate(1040 70) rotate(135) scale(390)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.78" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="card-shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#3d2138" flood-opacity="0.24" /></filter>
  </defs>
  <rect width="1200" height="630" fill="#090a0f" />
  <rect x="28" y="28" width="1144" height="574" rx="58" fill="url(#loan-paper)" />
  <rect x="28" y="28" width="1144" height="574" rx="58" fill="url(#loan-light)" />
  <g font-family="Arial, Helvetica, sans-serif" fill="#0b0c10">
