    <text x="82" y="252" font-size="59" font-weight="900" letter-spacing="-2.5">Vay tiền mặt Home</text>
    <text x="82" y="332" font-size="59" font-weight="900" letter-spacing="-2.5">Credit online: Link giới thiệu</text>
    <text x="82" y="412" font-size="59" font-weight="900" letter-spacing="-2.5">lãi và phí</text>
  </g>
  <g transform="translate(880 132) rotate(6 108 160) scale(1.03)" filter="url(#card-shadow)">
    <rect width="216" height="320" rx="40" fill="#0b0c10" stroke="#43464e" stroke-width="2" />
    <g font-family="Arial, Helvetica, sans-serif"><text x="25" y="47" fill="#f8f5ef" font-size="22" font-weight="800">1 Phút</text><text x="25" y="68" fill="#aaa9b2" font-size="10" font-weight="700" letter-spacing="2.1">ĐĂNG KÝ</text></g>
    <g fill="none" stroke-linecap="round" stroke-width="6" transform="rotate(-7 180 52)"><path d="M171 37h23" stroke="#8f74ff" /><path d="M161 50h33" stroke="#e393bc" /><path d="M149 63h45" stroke="#ffb58f" /></g>
    <g font-family="Arial, Helvetica, sans-serif"><text x="26" y="132" fill="#ad9cff" font-size="13" font-weight="800">01</text><text x="66" y="132" fill="#f6f2ec" font-size="15" font-weight="700">Số tiền</text><text x="26" y="196" fill="#e09bc2" font-size="13" font-weight="800">02</text><text x="66" y="196" fill="#f6f2ec" font-size="15" font-weight="700">Chi phí</text><text x="26" y="260" fill="#ffb18f" font-size="13" font-weight="800">03</text><text x="66" y="260" fill="#f6f2ec" font-size="15" font-weight="700">Trả nợ</text></g>
    <g stroke="#34363c"><path d="M23 93h170" /><path d="M23 157h170" /><path d="M23 221h170" /><path d="M23 285h170" /></g>
